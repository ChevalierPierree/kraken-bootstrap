# Nom affiché dans l'onglet Actions
name: ci

# Déclencheurs : un push sur main, ou n'importe quelle pull request
on:
  push:
    branches: [main]
  pull_request:

# Droits donnés au workflow appelé : lire le code, écrire sur GHCR
permissions:
  contents: read
  packages: write

jobs:
  # Toute la CI est dans le dépôt kraken : on l'appelle, version de main
  kraken:
    uses: ChevalierPierree/kraken/.github/workflows/kraken.yml@main
