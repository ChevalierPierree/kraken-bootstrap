# Nom affiché dans l'onglet Actions
name: ci

# Déclencheurs : un push sur main, ou n'importe quelle pull request
on:
  push:
    branches: [main]
  pull_request:

# Droits du jeton GITHUB_TOKEN : lire le code, écrire sur GHCR
permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    # Machine Linux fournie par GitHub, neuve à chaque run
    runs-on: ubuntu-latest
    steps:
      # La machine démarre vide : on récupère le code du dépôt
      - name: Récupérer le code
        uses: actions/checkout@v7

      # Python 3.12, avec un cache pip qui dépend de requirements-dev.txt
      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Le rapport JUnit est écrit dans reports/junit.xml
      - name: Tests
        run: pytest -q --junitxml=reports/junit.xml

      # always() : on envoie le rapport même si les tests ont échoué
      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: reports/junit.xml

  build-push:
    # Ne démarre que si lint-test a réussi
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      # Chaque job a sa propre machine : on récupère à nouveau le code
      - name: Récupérer le code
        uses: actions/checkout@v7

      # GHCR refuse les majuscules : ${...,,} met le nom en minuscules
      - name: Préparer le nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Connexion seulement sur main, avec le jeton créé par GitHub
      - name: Se connecter à GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construit toujours, pousse seulement sur main
      - name: Construire et pousser l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
